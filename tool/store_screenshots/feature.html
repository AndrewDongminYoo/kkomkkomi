<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
    <style>
      /*
       * The source of the 1024x500 Play feature graphic: the app icon, the name, and the product line of copy.js beside
       * a before and after pair of the fixture photos. render.sh opens it as feature.html?lang=<ko|en>.
       * The color tokens and the mark are copies from web/index.html and tool/app_icon/symbol.svg, so a change to them
       * there must be repeated here.
       */
      :root {
        --bg: #faf7f1;
        --paper: #ffffff;
        --paper-edge: #e6e0d4;
        --ink: #16243b;
        --teal: #0f7f7a;
        --teal-ink: #0a5e5a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 40px;
        align-items: center;
        padding: 0 48px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .icon {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        display: block;
        box-shadow: 0 10px 24px -12px rgba(22, 36, 59, 0.45);
      }
      h1 {
        margin: 30px 0 0;
        font-size: 40px;
        line-height: 1.3;
        font-weight: 800;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      h1 em {
        font-style: normal;
        color: var(--teal-ink);
      }
      .sheet {
        background: var(--paper);
        border: 2px solid var(--paper-edge);
        border-radius: 22px;
        box-shadow:
          0 2px 4px rgba(22, 36, 59, 0.06),
          0 24px 60px -28px rgba(22, 36, 59, 0.28);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        padding: 20px;
      }
      .shot {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid var(--paper-edge);
        aspect-ratio: 4 / 3;
      }
      .shot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .lbl {
        position: absolute;
        left: 8px;
        top: 8px;
        background: var(--ink);
        color: var(--bg);
        font-size: 15px;
        font-weight: 500;
        line-height: 1.5;
        padding: 1px 9px;
        border-radius: 6px;
      }
      .lbl.after {
        background: var(--teal);
        color: #fff;
      }
    </style>
    <script src="copy.js"></script>
  </head>
  <body>
    <div>
      <div class="brand">
        <svg class="icon" viewBox="0 0 256 256" aria-hidden="true">
          <rect width="256" height="256" fill="#0f7f7a" />
          <g transform="translate(128 128) scale(0.64) translate(-128 -128)">
            <path
              fill="#87bfbd"
              d="M41 36H84A32 32 0 0 1 116 68V202A18 18 0 0 1 80 202V76A6 6 0 0 0 74 70H41A17 17 0 0 1 41 36Z" />
            <path
              fill="#fff"
              d="M157 36H200A32 32 0 0 1 232 68V202A18 18 0 0 1 196 202V76A6 6 0 0 0 190 70H157A17 17 0 0 1 157 36Z" />
          </g>
        </svg>
        <span id="name"></span>
      </div>
      <h1 id="line"></h1>
    </div>
    <div class="sheet">
      <div class="shot">
        <img src="photos/entrance-before.jpg" alt="" />
        <span class="lbl" id="before"></span>
      </div>
      <div class="shot">
        <img src="photos/entrance-after.jpg" alt="" />
        <span class="lbl after" id="after"></span>
      </div>
    </div>
    <script>
      const lang = new URLSearchParams(location.search).get("lang");
      const copy = window.STORE_COPY.feature[lang];
      if (!copy) throw new Error(`No feature copy in ${lang}`);
      document.documentElement.lang = lang;
      document.getElementById("name").textContent = copy.name;
      document.getElementById("before").textContent = copy.before;
      document.getElementById("after").textContent = copy.after;
      // A part of the line between two asterisks becomes an accent.
      const line = document.getElementById("line");
      copy.line.split("*").forEach((part, index) => {
        if (part === "") return;
        if (index % 2 === 1) {
          const em = document.createElement("em");
          em.textContent = part;
          line.append(em);
        } else {
          line.append(part);
        }
      });
    </script>
  </body>
</html>
