include:
  - package:very_good_analysis/analysis_options.yaml
  - package:bloc_lint/recommended.yaml
analyzer:
  errors:
    cascade_invocations: ignore
    lines_longer_than_80_chars: ignore
  exclude:
    # Generated by `flutterfire configure` and ignored by git. Tracked code
    # must not import it, and CI never sees it, so analysis leaves it out.
    - lib/firebase_options.dart
    - lib/l10n/gen/*
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**
    - windows/**
linter:
  rules:
    public_member_api_docs: false
formatter:
  page_width: 120
  trailing_commas: preserve
