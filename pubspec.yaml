name: kkomkkomi
description: "Kkomkkomi (꼼꼬미) is a mobile app for small cleaning companies in Korea: teams of one to five people that clean offices and shops on a recurring schedule."
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  characters: ^1.4.1
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.3.2
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  intl: ^0.20.3
  material_ui: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  purchases_flutter: ^10.14.0
  share_plus: ^13.3.1
  sqflite: ^2.4.4

dev_dependencies:
  bloc_lint: ^0.4.3
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.25
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.3
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/fonts/NotoSansKR-Regular.ttf
    - assets/fonts/OFL.txt
  generate: true
  uses-material-design: true

scripts: merry.yaml
