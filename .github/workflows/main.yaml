name: kkomkkomi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-pull-request:
    # The workflow grants contents read only, the title check reads the pull
    # request through the API, and the reusable workflow declares no
    # permissions of its own.
    permissions:
      pull-requests: read
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1.21.1

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1.21.1
    with:
      flutter_version: 3.47.7
      run_bloc_lint: true
      # Same as the analysis_options.yaml page_width.
      format_line_length: 120

  android:
    # Builds the development flavor, because google-services.json is not in the
    # repository and only the production variants read it. A debug build needs
    # no signing key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check import sorting
        run: dart run tool/check_imports.dart

      - name: Build the development debug APK
        run: flutter build apk --debug --flavor development --target lib/main_development.dart

  ios:
    # Builds the development flavor from a clean checkout, without
    # GoogleService-Info.plist, which is not in the repository. Only a
    # production build copies that file into the bundle. A build without
    # signing needs no certificate.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build the development debug app
        run: flutter build ios --no-codesign --debug --flavor development --target lib/main_development.dart

  windows:
    # The only place the Windows build is verified: no local script builds it.
    # The runner has no flavor configuration, so the target alone picks the
    # production entrypoint.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build the Windows app
        run: flutter build windows --release --target lib/main_production.dart

  rules:
    # Tests firestore.rules and storage.rules in the Firebase emulators. The
    # project ID starts with demo-, which keeps the emulators away from every
    # live project. The emulators need Java 21. The Firebase CLI is installed
    # here and not through the lockfile of test/rules, because its dependency
    # tree is large and only this job needs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/rules/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install the rules test packages
        run: npm ci --prefix test/rules

      - name: Install the Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Test the security rules in the emulators
        run: firebase emulators:exec --project demo-kkomkkomi --only firestore,storage "npm --prefix test/rules test"

  web:
    # Tests the web report page under web/report/ with fixture data in Node,
    # without a browser and without a network, as `merry run web` does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test the web report page
        run: node --test 'test/web/*.test.mjs'

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@61d25935870f12a1f2c23f2a04d5f193c83f4e5d # v1.21.1
    with:
      includes: |
        **/*.md
      modified_files_only: false
      config: cspell.json
