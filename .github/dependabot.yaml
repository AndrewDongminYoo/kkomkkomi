version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      # Every version update, majors included, in one PR; CI runs the actions it bumps.
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      pub:
        patterns: ["*"]
        update-types:
          - minor
          - patch
      pub-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /test/rules
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      test-rules:
        patterns: ["*"]
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    ignore:
      # Runtime majors without a security fix stay off (operator, 2026-10-24); com.android.application 9.4.1 came as #124.
      # update-types limits this to version updates; security updates still open.
      - dependency-name: com.android.application
        update-types:
          - version-update:semver-major
      # Gradle wrapper upgrades follow the Flutter/AGP (or React Native) toolchain, not Dependabot.
      # update-types limits this to version updates; security updates still open.
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      bundler-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      bundler-security:
        applies-to: security-updates
        patterns:
          - "*"
