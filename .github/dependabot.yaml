version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    groups:
      pub:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /test/rules
    schedule:
      interval: daily
    groups:
      test-rules:
        patterns: ["*"]
