# Generated by `merry init`, then filled in for this project.
#
# Every `flutter run` and `flutter build` here carries an explicit `--flavor` and
# `--target`, because the project has no `lib/main.dart` — only the three flavor
# entrypoints. A bare `flutter run` fails before it reaches a build.

# --- Development workflow ---------------------------------------------------
dev:
  (default): $dev:development

  development:
    (description): Runs the development flavor with hot reload.
    (scripts): flutter run --flavor development --target lib/main_development.dart

  staging:
    (description): Runs the staging flavor on the attached device.
    (scripts): flutter run --flavor staging --target lib/main_staging.dart

  production:
    (description): Runs the production flavor on the attached device.
    (scripts): flutter run --flavor production --target lib/main_production.dart

# --- Quality gates ----------------------------------------------------------
analyze:
  (description): Static analysis with very_good_analysis (zero tolerance, matches CI).
  (scripts): flutter analyze

lint:
  (description): Bloc-specific lints, the check CI enables through run_bloc_lint.
  (scripts): dart run bloc_tools:bloc lint .

format:
  (default): $format:write

  write:
    (description): Applies automated fixes and formats the Dart sources.
    (scripts):
      - dart fix --apply
      - dart format lib test

  check:
    (description): Fails when sources are not formatted, without writing anything.
    (scripts): dart format --output=none --set-exit-if-changed lib test

pretest:
  (description): Clears the previous coverage report.
  (scripts): rm -rf coverage

test:
  (description): Runs the suite without coverage, for a fast local loop.
  (scripts): flutter test --concurrency=4 --test-randomize-ordering-seed=random

coverage:
  (aliases): cov
  (description): Runs the suite under the same coverage gate as CI.
  (scripts): very_good test --coverage --min-coverage 100 --test-randomize-ordering-seed random

postcoverage:
  (description): Generates an HTML coverage report from the coverage data.
  (scripts): genhtml coverage/lcov.info -o coverage/html --quiet

rules:
  # Not part of `check`: the Firebase emulators need Java 21 and the Firebase
  # CLI. The project ID starts with demo-, which keeps the emulators away from
  # every live project. CI runs the same command in the `rules` job.
  (description): Tests firestore.rules and storage.rules in the Firebase emulators.
  (scripts):
    - npm ci --prefix test/rules
    - firebase emulators:exec --project demo-kkomkkomi --only firestore,storage "npm --prefix test/rules test"

web:
  # The page is plain JavaScript without a build step, and the tests use only
  # Node: a fake fetch gives fixture documents and a fake document makes the
  # nodes, so no browser and no network is involved.
  (description): Tests the web report page under web/report/ with fixture data.
  (scripts): node --test 'test/web/*.test.mjs'

precheck:
  # `dart format` reads analysis_options.yaml, whose `include:` entries are
  # package URIs, and analysis needs lib/l10n/gen, which `flutter pub get`
  # generates. CI resolves packages first, so the local gate does the same.
  (description): Resolves packages and generates localizations before the gate runs.
  (scripts): flutter pub get

check:
  (description): The full local gate before committing — format, analyze, bloc lint, test, web page test.
  (execution): once
  (scripts):
    - $format:check
    - $analyze
    - $lint
    - $test
    - $web

# --- Store images -----------------------------------------------------------
store:
  # Not part of `check`: the render needs a headless Chromium in CHROME,
  # ImageMagick 7, and a network connection for the Google Fonts of the frames.
  # tool/store_screenshots/render.sh owns the steps.
  (default): $store:render

  render:
    (description): Renders the store screenshots and the Play feature graphic from fixture data, then checks them.
    (scripts): bash tool/store_screenshots/render.sh

  check:
    (description): Checks the size and the alpha channel of every store image.
    (scripts): bash tool/store_screenshots/check.sh

# --- Code generation --------------------------------------------------------
l10n:
  (aliases): gen-l10n
  (description): Regenerates localizations from the ARB files (config in l10n.yaml).
  (scripts): flutter gen-l10n

# --- Maintenance ------------------------------------------------------------
reinstall:
  (description): Clears the build output and refetches dependencies.
  (scripts):
    - flutter clean
    - flutter pub get

# --- Build artifacts --------------------------------------------------------
# No `(default)`: which artifact this project ships is a release decision.
# Windows has no script on purpose: its build is verified only in CI.
# Each script reads the RevenueCat keys from config/revenuecat.json, which git
# ignores, and `release check` stops when the file is missing or lacks one of
# its two keys. Empty keys build an app without subscriptions. The metadata
# lanes build nothing, so they run the check with `--metadata`, which leaves
# out the keys file.
build:
  apk:
    (description): Builds the production release APK.
    (scripts): flutter build apk --release --flavor production --target lib/main_production.dart --tree-shake-icons --dart-define-from-file=config/revenuecat.json

  aab:
    (description): Builds the production release Android App Bundle.
    (scripts): flutter build appbundle --release --flavor production --target lib/main_production.dart --tree-shake-icons --dart-define-from-file=config/revenuecat.json

  ipa:
    (description): Builds the production release iOS archive and IPA.
    (scripts): flutter build ipa --release --flavor production --target lib/main_production.dart --tree-shake-icons --dart-define-from-file=config/revenuecat.json

# --- Store release ----------------------------------------------------------
# CLAUDE.md, section "Release", owns the environment variables. Every script
# with 🚨 publishes to a store: the operator runs or approves it each time.
#
# A script list runs on after a failed script unless it sets
# `(execution): once`, so each publish script sets it: a failed check stops
# the build, and a failed build stops the upload. FASTLANE_SKIP_UPDATE_CHECK
# keeps fastlane from asking RubyGems for a new version before the lane runs,
# so a lane without its credentials stops before any network call.
# `flutter build ipa` exits 0 when the IPA export fails after the archive, so
# `release ios` deletes build/ios/ipa first, and the `beta` lane stops for an
# IPA whose version is not the one of pubspec.yaml.
release:
  check:
    (description): Offline checks before a release — a clean tree, the CHANGELOG.md entry and the Play changelogs of the pubspec.yaml version, the store text limits, and the RevenueCat keys file.
    (scripts): dart run tool/release_check.dart

  ios:
    (description): 🚨 Checks, builds the production IPA, and uploads it to TestFlight.
    (execution): once
    (scripts):
      - $release:check
      - FASTLANE_SKIP_UPDATE_CHECK=1 bundle exec fastlane ios credentials
      - rm -rf build/ios/ipa
      - $build:ipa
      - FASTLANE_SKIP_UPDATE_CHECK=1 bundle exec fastlane ios beta

  android:
    (description): 🚨 Checks, builds the production App Bundle, and uploads it to the Google Play internal testing track.
    (execution): once
    (scripts):
      - $release:check
      - FASTLANE_SKIP_UPDATE_CHECK=1 bundle exec fastlane android credentials
      - $build:aab
      - FASTLANE_SKIP_UPDATE_CHECK=1 bundle exec fastlane android internal

  metadata:
    ios:
      (description): 🚨 Checks, then uploads fastlane/metadata/ios and fastlane/screenshots/ios to App Store Connect, without a binary and without a review submission.
      (execution): once
      (scripts):
        - dart run tool/release_check.dart --metadata
        - FASTLANE_SKIP_UPDATE_CHECK=1 bundle exec fastlane ios metadata

    android:
      (description): 🚨 Checks, then uploads the texts and images of fastlane/metadata/android to Google Play, without a bundle.
      (execution): once
      (scripts):
        - dart run tool/release_check.dart --metadata
        - FASTLANE_SKIP_UPDATE_CHECK=1 bundle exec fastlane android metadata
